<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বিশ্বব্যাংক - লগইন</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-container { width: 100%; max-width: 420px; background-color: #ffffff; padding: 40px 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); text-align: center; }
        
        /* লোগো */
        .logo-section { margin-bottom: 25px; }
        .logo-icon { width: 80px; height: 80px; background: linear-gradient(135deg, #1e88e5, #1565c0); border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 15px auto; box-shadow: 0 8px 15px rgba(30, 136, 229, 0.3); }
        .logo-icon i { font-size: 40px; color: #ffffff; }
        .logo-section h1 { font-size: 28px; color: #0f172a; font-weight: 700; margin-bottom: 8px; }
        .logo-section p { font-size: 14px; color: #64748b; }
        
        /* ইনপুট ফিল্ড */
        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; font-size: 15px; font-weight: 600; color: #0f172a; margin-bottom: 8px; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i.prefix-icon { position: absolute; left: 15px; color: #94a3b8; font-size: 16px; }
        
        .input-wrapper input { 
            width: 100%; 
            padding: 14px 15px 14px 45px; 
            border: 1px solid #cbd5e1; 
            border-radius: 10px; 
            font-size: 15px; 
            font-family: 'Hind Siliguri', sans-serif !important; 
            font-weight: 700;
            outline: none; 
            background-color: #f8fafc; 
            transition: all 0.3s ease; 
            text-indent: 1px;
            color: #0f172a;
        }
        .input-wrapper input:focus { border-color: #1e88e5; background-color: #ffffff; box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.1); }
        .input-wrapper i.suffix-icon { position: absolute; right: 15px; color: #94a3b8; cursor: pointer; }
        
        /* বাটন */
        .btn-signin { width: 100%; background-color: #1565c0; color: #ffffff; border: none; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px; margin-bottom: 20px; transition: background 0.3s; }
        .btn-signin:hover { background-color: #0d47a1; }
        .security-note { font-size: 13px; color: #64748b; margin-bottom: 30px; display: flex; justify-content: center; align-items: center; gap: 5px; }
        .divider-text { font-size: 15px; color: #475569; margin-bottom: 15px; }
        .btn-create { width: 100%; background-color: transparent; color: #1565c0; border: 2px solid #1565c0; padding: 12px; border-radius: 30px; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: all 0.3s; text-decoration: none; }
        .btn-create:hover { background-color: #f0f7ff; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-section">
            <div class="logo-icon"><i class="fa-solid fa-shield-halved"></i></div>
            <h1>বিশ্বব্যাংক</h1>
            <p>নিরাপদভাবে আপনার অ্যাকাউন্টে সাইন ইন করুন</p>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label for="phone">ফোন নম্বর</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-phone prefix-icon"></i>
                    <input type="tel" id="phone" placeholder="আপনার ফোন নম্বর লিখুন" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">পাসওয়ার্ড</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock prefix-icon"></i>
                    <input type="password" id="password" placeholder="আপনার পাসওয়ার্ড লিখুন" required>
                    <i class="fa-regular fa-eye suffix-icon"></i>
                </div>
            </div>

            <button type="submit" class="btn-signin" id="loginBtn"><i class="fa-solid fa-arrow-right-to-bracket"></i> সাইন ইন করুন</button>
            <div class="security-note"><i class="fa-solid fa-lock"></i> আপনার তথ্য সুরক্ষিতভাবে এনক্রিপ্ট করা হয়</div>
        </form>

        <p class="divider-text">অ্যাকাউন্ট নেই?</p>
        <a href="register.html" class="btn-create">
            <i class="fa-solid fa-user-plus"></i> নতুন একাউন্ট তৈরি করুন
        </a>
    </div>

    <!-- ★★★ Firebase Login JavaScript ★★★ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD9fEvnTdI5y4AQiFIENZUD9KBtBx1Re4g",
            authDomain: "worldbank-72fb8.firebaseapp.com",
            projectId: "worldbank-72fb8",
            storageBucket: "worldbank-72fb8.firebasestorage.app",
            messagingSenderId: "102460952898",
            appId: "1:102460952898:web:c2946f3c9e78dca3a138db",
            measurementId: "G-KK74DHYW69"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            btn.innerText = 'অপেক্ষা করুন...';
            btn.disabled = true;

            // ★★★ ফোন নম্বরকে Firebase-এর ইমেইলে রূপান্তর ★★★
            const fakeEmail = phone + "@worldbank.app";

            try {
                const userCredential = await signInWithEmailAndPassword(auth, fakeEmail, password);
                const user = userCredential.user;

                // Firestore থেকে ইউজারের ডেটা আনা
                const userDoc = await getDoc(doc(db, "users", user.uid));
                
                if (userDoc.exists()) {
                    const userData = userDoc.data();

                    if (userData.status === 'blocked') {
                        alert("আপনার অ্যাকাউন্ট ব্লক করা হয়েছে! অ্যাডমিনের সাথে যোগাযোগ করুন।");
                        btn.innerText = 'সাইন ইন করুন';
                        btn.disabled = false;
                        return;
                    }

                    // বর্তমান ইউজার সেভ
                    localStorage.setItem('worldbank_current_user', JSON.stringify({
                        uid: user.uid,
                        fullname: userData.fullname,
                        phone: userData.phone
                    }));

                    alert("লগইন সফল হয়েছে! স্বাগতম, " + userData.fullname);

                    if (userData.applied === true) {
                        window.location.href = "status.html";
                    } else {
                        window.location.href = "application.html";
                    }
                } else {
                    alert("ইউজারের তথ্য পাওয়া যায়নি!");
                    btn.innerText = 'সাইন ইন করুন';
                    btn.disabled = false;
                }

            } catch (error) {
                console.error("Error:", error);
                let msg = "ভুল ফোন নম্বর অথবা পাসওয়ার্ড!";
                if (error.code === 'auth/user-not-found') {
                    msg = "এই ফোন নম্বর দিয়ে কোনো অ্যাকাউন্ট নেই!";
                } else if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                    msg = "পাসওয়ার্ড ভুল! আবার চেষ্টা করুন।";
                }
                alert(msg);
                btn.innerText = 'সাইন ইন করুন';
                btn.disabled = false;
            }
        });
    </script>

</body>
</html>
