<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>বিশ্বব্যাংক - লগইন</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }
        html { touch-action: pan-y; -ms-touch-action: pan-y; }
        body { background-color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; overflow-x: hidden; max-width: 100vw; touch-action: pan-y; }
        
        /* ★★★ কন্টেইনারের উপরের প্যাডিং কমিয়ে লোগোকে উপরে আনা হয়েছে ★★★ */
        .login-container { 
            width: 100%; 
            max-width: 420px; 
            background-color: #ffffff; 
            padding: 20px 30px 40px 30px; /* উপরে 20px, নিচে 40px */
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); 
            text-align: center; 
        }

        /* ★★★ লোগো সেকশনের মার্জিন কমানো ★★★ */
        .logo-section { 
            margin-bottom: 15px; 
            margin-top: 0; 
        }

        /* ★★★ লোগো আইকন বড় করা (৯০px → ১১০px) এবং উপরে আনা ★★★ */
        .logo-icon {
            width: 110px;
            height: 110px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 10px auto; /* নিচের মার্জিন ১৫px → ১০px */
            box-shadow: 0 4px 15px rgba(30, 136, 229, 0.25);
            overflow: hidden;
            animation: rotateLogo 8s linear infinite;
            position: relative;
        }

        /* হালকা করে বাংলাদেশ সরকারের সিল — লোগোর পেছনে */
        .logo-icon::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/8/84/Government_Seal_of_Bangladesh.svg');
            background-size: 70%;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.35;
            z-index: 1;
            border-radius: 50%;
        }

        /* সামনের স্তর: World Bank লোগো */
        .logo-icon img { 
            width: 75%; 
            height: 75%; 
            object-fit: contain; 
            position: relative;
            z-index: 2;
        }
        
        @keyframes rotateLogo { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }

        .logo-section h1 { font-size: 28px; color: #0f172a; font-weight: 700; margin-bottom: 8px; }
        .logo-section p { font-size: 14px; color: #64748b; }

        .bank-section { margin: 20px 0 25px 0; overflow: hidden; position: relative; padding: 10px 0; background: transparent; }
        .bank-slider { display: flex; gap: 15px; animation: scrollBanks 25s linear infinite; width: max-content; align-items: center; }
        .bank-item { display: flex; align-items: center; justify-content: center; padding: 8px 16px; border-radius: 8px; background: #ffffff; border: 1.5px solid #e2e8f0; box-shadow: 0 1px 4px rgba(0,0,0,0.04); flex-shrink: 0; white-space: nowrap; }
        .bank-item .bank-name { font-size: 13px; font-weight: 700; letter-spacing: 0.3px; }
        @keyframes scrollBanks { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* ★★★ লাল বৃত্তের ভেতরের অংশের কন্টেইনার — এখানে হালকা সিল বসবে ★★★ */
        .form-watermark-area {
            position: relative;
            padding: 10px 0;
            border-radius: 12px;
            overflow: hidden;
        }
        .form-watermark-area::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/8/84/Government_Seal_of_Bangladesh.svg');
            background-size: 55%;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.18; /* খুব হালকা */
            z-index: 0;
            pointer-events: none;
        }
        .form-watermark-area > * {
            position: relative;
            z-index: 1;
        }

        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; font-size: 15px; font-weight: 600; color: #0f172a; margin-bottom: 8px; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i.prefix-icon { position: absolute; left: 15px; color: #94a3b8; font-size: 16px; }

        .input-wrapper input { width: 100%; padding: 14px 15px 14px 45px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 15px; font-family: 'Hind Siliguri', sans-serif !important; font-weight: 700; outline: none; background-color: #f8fafc; transition: all 0.3s ease; text-indent: 1px; color: #0f172a; }
        .input-wrapper input:focus { border-color: #1e88e5; background-color: #ffffff; box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.1); }
        .input-wrapper i.suffix-icon { position: absolute; right: 15px; color: #94a3b8; cursor: pointer; }

        .btn-signin { width: 100%; background-color: #1565c0; color: #ffffff; border: none; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px; margin-bottom: 20px; transition: background 0.3s; }
        .btn-signin:hover { background-color: #0d47a1; }
        .btn-signin:disabled { background-color: #94a3b8; cursor: not-allowed; }
        .security-note { font-size: 13px; color: #64748b; margin-bottom: 30px; display: flex; justify-content: center; align-items: center; gap: 5px; }
        .divider-text { font-size: 15px; color: #475569; margin-bottom: 15px; }
        .btn-create { width: 100%; background-color: transparent; color: #1565c0; border: 2px solid #1565c0; padding: 12px; border-radius: 30px; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: all 0.3s; text-decoration: none; }
        .btn-create:hover { background-color: #f0f7ff; }

        .error-box { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 12px 15px; border-radius: 8px; font-size: 14px; margin-bottom: 15px; text-align: left; display: none; }
        .error-box.show { display: block; }
        .error-box i { margin-right: 8px; }

        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.98); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; padding: 20px; }
        .loading-overlay.show { display: flex; }
        .loading-content { text-align: center; max-width: 320px; width: 100%; }
        .loading-spinner { width: 80px; height: 80px; border: 6px solid #e2e8f0; border-top: 6px solid #1e88e5; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 25px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { font-size: 18px; font-weight: 700; color: #0f172a; margin-bottom: 10px; }
        .loading-subtext { font-size: 14px; color: #64748b; font-weight: 500; }
        .success-circle { width: 80px; height: 80px; border: 5px solid #22c55e; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 25px auto; animation: popIn 0.5s ease; }
        .success-circle i { font-size: 40px; color: #22c55e; animation: tickIn 0.5s ease; }
        @keyframes popIn { 0% { transform: scale(0); } 80% { transform: scale(1.1); } 100% { transform: scale(1); } }
        @keyframes tickIn { 0% { transform: scale(0); opacity: 0; } 50% { opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-section">
            <div class="logo-icon">
                <img src="https://upload.wikimedia.org/wikipedia/commons/8/8c/World_Bank_logo.svg" alt="World Bank Logo" onerror="this.parentElement.innerHTML='<i class=\'fa-solid fa-shield-halved\' style=\'font-size:40px; color:#1e88e5;\'></i>';">
            </div>
            <h1>বিশ্বব্যাংক</h1>
            <p>নিরাপদভাবে আপনার অ্যাকাউন্টে সাইন ইন করুন</p>
        </div>

        <div class="bank-section">
            <div class="bank-slider" id="bankSlider"></div>
        </div>

        <!-- ★★★ হালকা সিল বসবে এখানে — লাল বৃত্তের ভেতরের অংশ ★★★ -->
        <div class="form-watermark-area">

            <div class="error-box" id="errorBox">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="errorText"></span>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="phone">ফোন নম্বর</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-phone prefix-icon"></i>
                        <input type="tel" id="phone" placeholder="আপনার ফোন নম্বর লিখুন" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">পাসওয়ার্ড</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock prefix-icon"></i>
                        <input type="password" id="password" placeholder="আপনার পাসওয়ার্ড লিখুন" required>
                        <i class="fa-regular fa-eye suffix-icon" id="togglePassword"></i>
                    </div>
                </div>

                <button type="submit" class="btn-signin" id="loginBtn"><i class="fa-solid fa-arrow-right-to-bracket"></i> সাইন ইন করুন</button>
                <div class="security-note"><i class="fa-solid fa-lock"></i> আপনার তথ্য সুরক্ষিতভাবে এনক্রিপ্ট করা হয়</div>
            </form>

        </div>

        <p class="divider-text">অ্যাকাউন্ট নেই?</p>
        <a href="register.html" class="btn-create">
            <i class="fa-solid fa-user-plus"></i> নতুন একাউন্ট তৈরি করুন
        </a>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content" id="loadingContent"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD9fEvnTdI5y4AQiFIENZUD9KBtBx1Re4g",
            authDomain: "worldbank-72fb8.firebaseapp.com",
            projectId: "worldbank-72fb8",
            storageBucket: "worldbank-72fb8.firebasestorage.app",
            messagingSenderId: "102460952898",
            appId: "1:102460952898:web:c2946f3c9e78dca3a138db",
            measurementId: "G-KK74DHYW69"
        };

        const app = initializeApp(firebaseConfig, "worldbank-app");
        const auth = getAuth(app);
        const db = getFirestore(app);

        setPersistence(auth, browserLocalPersistence).catch((error) => {
            console.error("Persistence error:", error);
        });

        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingContent = document.getElementById('loadingContent');
        const errorBox = document.getElementById('errorBox');
        const errorText = document.getElementById('errorText');

        function showError(msg) {
            errorText.innerText = msg;
            errorBox.classList.add('show');
            setTimeout(() => { errorBox.classList.remove('show'); }, 6000);
        }

        function hideError() {
            errorBox.classList.remove('show');
        }

        function showLoadingScreen() {
            loadingContent.innerHTML = `
                <div class="loading-spinner"></div>
                <div class="loading-text">লগইন করা হচ্ছে...</div>
                <div class="loading-subtext">অনুগ্রহ করে অপেক্ষা করুন</div>
            `;
            loadingOverlay.classList.add('show');
        }

        function showSuccessScreen(name) {
            loadingContent.innerHTML = `
                <div class="success-circle">
                    <i class="fa-solid fa-check"></i>
                </div>
                <div class="loading-text">লগইন সফল হয়েছে!</div>
                <div class="loading-subtext">স্বাগতম, ${name}</div>
            `;
        }

        // পাসওয়ার্ড শো/হাইড
        document.getElementById('togglePassword').addEventListener('click', function() {
            const pw = document.getElementById('password');
            if (pw.type === 'password') {
                pw.type = 'text';
                this.classList.remove('fa-eye');
                this.classList.add('fa-eye-slash');
            } else {
                pw.type = 'password';
                this.classList.add('fa-eye');
                this.classList.remove('fa-eye-slash');
            }
        });

        const banks = [
            { name: 'BRAC Bank', color: '#006CB5' },
            { name: 'City Bank', color: '#F20823' },
            { name: 'Dhaka Bank', color: '#1B5FAA' },
            { name: 'Dutch-Bangla Bank', color: '#0D984A' },
            { name: 'Eastern Bank', color: '#F5A623' },
            { name: 'Prime Bank', color: '#E31E24' },
            { name: 'Bank Asia', color: '#1B5FAA' },
            { name: 'ONE Bank', color: '#E31E24' },
            { name: 'বিকাশ', color: '#E2136E' },
            { name: 'নগদ', color: '#F58220' }
        ];

        const bankSlider = document.getElementById('bankSlider');
        if (bankSlider) {
            const allBanks = [...banks, ...banks];
            bankSlider.innerHTML = allBanks.map(bank => `
                <div class="bank-item">
                    <span class="bank-name" style="color: ${bank.color};">${bank.name}</span>
                </div>
            `).join('');
        }

        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            hideError();

            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            if (phone.length !== 11 || isNaN(phone)) {
                showError("দয়া করে ১১ ডিজিটের সঠিক ফোন নম্বর লিখুন।");
                return;
            }
            if (password.length < 6) {
                showError("পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।");
                return;
            }

            btn.disabled = true;
            showLoadingScreen();

            const fakeEmail = phone + "@worldbank.app";

            try {
                console.log("Starting login...");

                const userCredential = await signInWithEmailAndPassword(auth, fakeEmail, password);
                const user = userCredential.user;
                console.log("Login success, UID:", user.uid);

                const userDoc = await getDoc(doc(db, "users", user.uid));

                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    console.log("User data found:", userData);

                    if (userData.status === 'blocked') {
                        loadingOverlay.classList.remove('show');
                        btn.disabled = false;
                        showError("আপনার অ্যাকাউন্ট ব্লক করা হয়েছে! অ্যাডমিনের সাথে যোগাযোগ করুন।");
                        return;
                    }

                    localStorage.setItem('worldbank_current_user', JSON.stringify({
                        uid: user.uid,
                        fullname: userData.fullname,
                        phone: userData.phone
                    }));

                    setTimeout(function() {
                        showSuccessScreen(userData.fullname);

                        setTimeout(function() {
                            if (userData.applied === true || userData.loanData) {
                                window.location.href = "status.html";
                            } else {
                                window.location.href = "application.html";
                            }
                        }, 1000);

                    }, 1500);

                } else {
                    loadingOverlay.classList.remove('show');
                    btn.disabled = false;
                    showError("ইউজারের তথ্য Firestore-এ পাওয়া যায়নি!");
                }

            } catch (error) {
                console.error("Login Error:", error);
                loadingOverlay.classList.remove('show');
                btn.disabled = false;

                let msg = "";
                switch (error.code) {
                    case 'auth/user-not-found':
                        msg = "এই ফোন নম্বর দিয়ে কোনো অ্যাকাউন্ট নেই!";
                        break;
                    case 'auth/wrong-password':
                        msg = "পাসওয়ার্ড ভুল! আবার চেষ্টা করুন।";
                        break;
                    case 'auth/invalid-credential':
                        msg = "ফোন নম্বর অথবা পাসওয়ার্ড ভুল!";
                        break;
                    case 'auth/network-request-failed':
                        msg = "ইন্টারনেট সংযোগে সমস্যা।";
                        break;
                    case 'auth/too-many-requests':
                        msg = "অনেকবার ভুল চেষ্টা করেছেন। কিছুক্ষণ পর আবার চেষ্টা করুন।";
                        break;
                    default:
                        msg = "লগইন ব্যর্থ: " + (error.message || "অজানা সমস্যা");
                }
                showError(msg);
            }
        });
    </script>

</body>
</html>
