    <script>
        // ★★★ প্রতিটি ইনপুট ফিল্ডে আইডি যোগ করা (JavaScript দিয়ে) ★★★
        // যাতে পরে সহজে ডেটা নেওয়া যায়
        const inputFields = document.querySelectorAll('.input-wrapper input, .input-wrapper select');
        const fieldNames = ['name', 'father_name', 'mother_name', 'nid', 'blood_group', 'present_address', 'permanent_address', 'occupation'];
        
        // প্রতিটি ইনপুট ফিল্ডে ডেটা-নাম অ্যাট্রিবিউট যোগ করা
        inputFields.forEach((field, index) => {
            if (fieldNames[index]) {
                field.setAttribute('data-field', fieldNames[index]);
            }
        });

        // ★★★ ছবি আপলোড সিস্টেম ★★★
        const uploadBoxes = document.querySelectorAll('.upload-box');
        const imageKeys = ['nid_front', 'nid_back', 'photo'];
        
        uploadBoxes.forEach((box, index) => {
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'image/*';
            fileInput.style.display = 'none';
            box.appendChild(fileInput);
            
            box.addEventListener('click', function(e) {
                if (e.target.classList.contains('close-btn') || e.target.closest('.close-btn')) return;
                fileInput.click();
            });
            
            fileInput.addEventListener('change', function() {
                const file = this.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Image = e.target.result;
                    
                    const img = box.querySelector('img');
                    const icon = box.querySelector('.upload-icon');
                    const title = box.querySelector('h4');
                    const desc = box.querySelector('p');
                    
                    if (img) img.remove();
                    
                    const newImg = document.createElement('img');
                    newImg.src = base64Image;
                    newImg.style.maxWidth = '100%';
                    newImg.style.maxHeight = '120px';
                    newImg.style.borderRadius = '8px';
                    newImg.style.margin = '0 auto 10px auto';
                    newImg.style.display = 'block';
                    
                    box.insertBefore(newImg, icon);
                    icon.style.display = 'none';
                    title.innerText = 'ছবি আপলোড হয়েছে ✓';
                    desc.innerText = 'পরিবর্তন করতে আবার ক্লিক করুন';
                    
                    const closeBtn = box.querySelector('.close-btn');
                    if (closeBtn) closeBtn.style.display = 'flex';
                    
                    // ছবি সাময়িকভাবে সেভ করা (ফর্ম সাবমিটের আগে)
                    if (!window.uploadedImages) window.uploadedImages = {};
                    window.uploadedImages[imageKeys[index]] = base64Image;
                };
                reader.readAsDataURL(file);
            });
            
            const closeBtn = box.querySelector('.close-btn');
            if (closeBtn) {
                closeBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const img = box.querySelector('img');
                    if (img) img.remove();
                    
                    const icon = box.querySelector('.upload-icon');
                    const title = box.querySelector('h4');
                    const desc = box.querySelector('p');
                    
                    icon.style.display = 'block';
                    title.innerText = title.getAttribute('data-original') || title.innerText;
                    desc.innerText = 'JPG, PNG (ক্লিক করে আপলোড করুন)';
                    closeBtn.style.display = 'none';
                    
                    if (window.uploadedImages) {
                        delete window.uploadedImages[imageKeys[index]];
                    }
                });
            }
        });

        // ★★★ ফর্ম সাবমিট হলে সব তথ্য সেভ করা ★★★
        document.getElementById('applicationForm').addEventListener('submit', function(event) {
            event.preventDefault(); // ফর্ম সাবমিট আটকানো

            // বর্তমান ইউজার নেওয়া
            let currentUser = JSON.parse(localStorage.getItem('worldbank_current_user'));
            if (!currentUser) {
                alert("আপনি লগইন করেননি! দয়া করে লগইন করুন।");
                window.location.href = 'index.html';
                return;
            }

            // ★★★ সব ইনপুট ফিল্ডের ডেটা সংগ্রহ ★★★
            const formData = {};
            inputFields.forEach(field => {
                const fieldName = field.getAttribute('data-field');
                if (fieldName) {
                    formData[fieldName] = field.value.trim();
                }
            });

            // ★★★ ছবিগুলো সংগ্রহ ★★★
            formData.documents = window.uploadedImages || {};

            // ★★★ স্বাক্ষরের তথ্য (স্বাক্ষর বক্সে ক্লিক করলে সেভ হবে — আপাতত ডেমো) ★★★
            formData.signature = 'signed'; // আপাতত ডেমো

            // ★★★ ভ্যালিডেশন — সব ফিল্ড পূরণ হয়েছে কি না ★★★
            if (!formData.name || !formData.father_name || !formData.mother_name || !formData.nid || !formData.blood_group || !formData.present_address || !formData.permanent_address || !formData.occupation) {
                alert("দয়া করে সব তথ্য পূরণ করুন।");
                return;
            }

            // ★★★ LocalStorage-এ সেভ করা ★★★
            let users = JSON.parse(localStorage.getItem('worldbank_users')) || [];
            const userIndex = users.findIndex(u => u.id === currentUser.id);
            if (userIndex === -1) return;

            // ইউজারের তথ্য আপডেট করা
            users[userIndex].applied = true;
            users[userIndex].appliedAt = new Date().toLocaleString('bn-BD');
            users[userIndex].applicationData = formData;
            
            localStorage.setItem('worldbank_users', JSON.stringify(users));

            // বর্তমান ইউজারেও সেভ করা
            currentUser.applied = true;
            currentUser.appliedAt = new Date().toLocaleString('bn-BD');
            currentUser.applicationData = formData;
            localStorage.setItem('worldbank_current_user', JSON.stringify(currentUser));

            // ★★★ nominee.html এ পাঠানো ★★★
            alert("আপনার তথ্য সফলভাবে সেভ হয়েছে! এখন নমিনীর তথ্য দিন।");
            window.location.href = "nominee.html";
        });
    </script>
