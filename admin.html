<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অনুমতি নেই - WorldBank</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .access-denied { text-align: center; color: white; max-width: 400px; }
        .access-denied i { font-size: 80px; color: #ef4444; margin-bottom: 20px; display: block; }
        .access-denied h1 { font-size: 28px; margin-bottom: 10px; font-weight: 700; }
        .access-denied p { font-size: 16px; color: #94a3b8; margin-bottom: 25px; line-height: 1.6; }
        .access-denied a { display: inline-block; background: #1e88e5; color: white; text-decoration: none; padding: 14px 30px; border-radius: 8px; font-weight: 600; font-size: 16px; transition: 0.3s; }
        .access-denied a:hover { background: #1565c0; }
    </style>
</head>
<body>
    <div class="access-denied">
        <i class="fa-solid fa-ban"></i>
        <h1>প্রবেশাধিকার নেই</h1>
        <p>এই পেজটি শুধুমাত্র অ্যাডমিনের জন্য।<br>অনুগ্রহ করে আগে অ্যাডমিন লগইন করুন।</p>
        <a href="admin_login.html"><i class="fa-solid fa-right-to-bracket"></i> অ্যাডমিন লগইনে যান</a>
    </div>

    <script>
        // ★★★ সরাসরি admin_login.html এ পাঠিয়ে দেওয়া ★★★
        setTimeout(function() {
            window.location.href = 'admin_login.html';
        }, 2000);
    </script>
</body>
</html>
