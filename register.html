<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>নতুন অ্যাকাউন্ট - বিশ্বব্যাংক</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }
        html { touch-action: pan-y; -ms-touch-action: pan-y; }
        body { background-color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; overflow-x: hidden; max-width: 100vw; touch-action: pan-y; }
        .login-container { width: 100%; max-width: 420px; background-color: #ffffff; padding: 40px 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); text-align: center; }
        .logo-section { margin-bottom: 25px; }
        .logo-icon { width: 80px; height: 80px; background: linear-gradient(135deg, #1e88e5, #1565c0); border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 15px auto; box-shadow: 0 8px 15px rgba(30, 136, 229, 0.3); }
        .logo-icon i { font-size: 40px; color: #ffffff; }
        .logo-section h1 { font-size: 28px; color: #0f172a; font-weight: 700; margin-bottom: 8px; }
        .logo-section p { font-size: 14px; color: #64748b; }
        .input-group { text-align: left; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 15px; font-weight: 600; color: #0f172a; margin-bottom: 6px; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i.prefix-icon { position: absolute; left: 15px; color: #94a3b8; font-size: 16px; }
        .input-wrapper input { width: 100%; padding: 14px 15px 14px 45px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 15px; font-family: 'Hind Siliguri', sans-serif !important; font-weight: 700; outline: none; background-color: #f8fafc; transition: all 0.3s ease; text-indent: 1px; color: #0f172a; }
        .input-wrapper input:focus { border-color: #1e88e5; background-color: #ffffff; box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.1); }
        .btn-signin { width: 100%; background-color: #1565c0; color: #ffffff; border: none; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 15px; margin-bottom: 20px; transition: background 0.3s; }
        .btn-signin:hover { background-color: #0d47a1; }
        .security-note { font-size: 13px; color: #64748b; margin-bottom: 30px; display: flex; justify-content: center; align-items: center; gap: 5px; }
        .divider-text { font-size: 15px; color: #475569; margin-bottom: 15px; }
        .btn-create { width: 100%; background-color: transparent; color: #1565c0; border: 2px solid #1565c0; padding: 12px; border-radius: 30px; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: all 0.3s; text-decoration: none; }
        .btn-create:hover { background-color: #f0f7ff; }

        /* ★★★ লোডিং স্ক্রিন (ওভারলে) ★★★ */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.98);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }
        .loading-overlay.show { display: flex; }

        .loading-content {
            text-align: center;
            max-width: 320px;
            width: 100%;
        }

        .loading-spinner {
            width: 80px;
            height: 80px;
            border: 6px solid #e2e8f0;
            border-top: 6px solid #1e88e5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 25px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 10px;
        }

        .loading-subtext {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .success-circle {
            width: 80px;
            height: 80px;
            border: 5px solid #22c55e;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 25px auto;
            animation: popIn 0.5s ease;
        }
        .success-circle i {
            font-size: 40px;
            color: #22c55e;
            animation: tickIn 0.5s ease;
        }
        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        @keyframes tickIn {
            0% { transform: scale(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .phone-display {
            font-size: 20px;
            font-weight: 700;
            color: #1e88e5;
            letter-spacing: 1px;
            margin-top: 10px;
            padding: 10px 20px;
            background: #eff6ff;
            border-radius: 8px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-section">
            <div class="logo-icon"><i class="fa-solid fa-shield-halved"></i></div>
            <h1>বিশ্বব্যাংক</h1>
            <p>নতুন অ্যাকাউন্ট তৈরি করুন</p>
        </div>

        <form id="registerForm">
            <div class="input-group">
                <label for="fullname">পুরো নাম</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user prefix-icon"></i>
                    <input type="text" id="fullname" placeholder="আপনার পুরো নাম লিখুন" required>
                </div>
            </div>

            <div class="input-group">
                <label for="phone">ফোন নম্বর</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-phone prefix-icon"></i>
                    <input type="tel" id="phone" placeholder="আপনার ফোন নম্বর লিখুন" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">পাসওয়ার্ড</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock prefix-icon"></i>
                    <input type="password" id="password" placeholder="একটি শক্তিশালী পাসওয়ার্ড তৈরি করুন" required>
                </div>
            </div>

            <div class="input-group">
                <label for="confirm-password">পাসওয়ার্ড নিশ্চিত করুন</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock prefix-icon"></i>
                    <input type="password" id="confirm-password" placeholder="আপনার পাসওয়ার্ড আবার লিখুন" required>
                </div>
            </div>

            <button type="submit" class="btn-signin" id="registerBtn"><i class="fa-solid fa-user-plus"></i> নিবন্ধন করুন</button>
            <div class="security-note"><i class="fa-solid fa-lock"></i> আপনার তথ্য সুরক্ষিতভাবে এনক্রিপ্ট করা হয়</div>
        </form>

        <p class="divider-text">ইতিমধ্যে একটি অ্যাকাউন্ট আছে?</p>
        <a href="index.html" class="btn-create"><i class="fa-solid fa-arrow-right-to-bracket"></i> সাইন ইন করুন</a>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content" id="loadingContent"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD9fEvnTdI5y4AQiFIENZUD9KBtBx1Re4g",
            authDomain: "worldbank-72fb8.firebaseapp.com",
            projectId: "worldbank-72fb8",
            storageBucket: "worldbank-72fb8.firebasestorage.app",
            messagingSenderId: "102460952898",
            appId: "1:102460952898:web:c2946f3c9e78dca3a138db",
            measurementId: "G-KK74DHYW69"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingContent = document.getElementById('loadingContent');

        function showVerifyingScreen(phone) {
            loadingContent.innerHTML = `
                <div class="loading-spinner"></div>
                <div class="loading-text">ফোন নম্বর যাচাই করা হচ্ছে...</div>
                <div class="loading-subtext">অনুগ্রহ করে অপেক্ষা করুন</div>
                <div class="phone-display">${phone}</div>
            `;
            loadingOverlay.classList.add('show');
        }

        function showSuccessScreen() {
            loadingContent.innerHTML = `
                <div class="success-circle">
                    <i class="fa-solid fa-check"></i>
                </div>
                <div class="loading-text">নম্বরটি যাচাই সম্পন্ন হয়েছে!</div>
                <div class="loading-subtext">অ্যাকাউন্ট সফলভাবে তৈরি হয়েছে</div>
            `;
        }

        document.getElementById('registerForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const fullname = document.getElementById('fullname').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (fullname === "") { alert("দয়া করে আপনার পুরো নাম লিখুন।"); return; }
            if (phone.length !== 11 || isNaN(phone)) { alert("দয়া করে ১১ ডিজিটের সঠিক ফোন নম্বর লিখুন।"); return; }
            if (password.length < 6) { alert("পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।"); return; }
            if (password !== confirmPassword) { alert("আপনার দেওয়া দুটি পাসওয়ার্ড মিলছে না।"); return; }

            const fakeEmail = phone + "@worldbank.app";

            const btn = document.getElementById('registerBtn');
            btn.innerText = 'অপেক্ষা করুন...';
            btn.disabled = true;

            // ★★★ ক্লিক করার সাথে সাথেই লোডিং স্ক্রিন দেখানো ★★★
            showVerifyingScreen(phone);

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, fakeEmail, password);
                const user = userCredential.user;

                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid,
                    fullname: fullname,
                    phone: phone,
                    email: fakeEmail,
                    status: 'active',
                    applied: false,
                    approved: false,
                    registeredAt: new Date().toLocaleString('bn-BD'),
                    createdAt: new Date().toISOString()
                });

                localStorage.setItem('worldbank_current_user', JSON.stringify({
                    uid: user.uid,
                    fullname: fullname,
                    phone: phone
                }));

                // ★★★ Firebase-এ সফল — ৩ সেকেন্ড পর সফল স্ক্রিন, ৪ সেকেন্ড পর application.html ★★★
                setTimeout(function() {
                    showSuccessScreen();

                    setTimeout(function() {
                        window.location.href = "application.html";
                    }, 1000);

                }, 3000);

            } catch (error) {
                console.error("Error:", error);
                loadingOverlay.classList.remove('show');
                let msg = "রেজিস্ট্রেশন ব্যর্থ হয়েছে। ";
                if (error.code === 'auth/email-already-in-use') {
                    msg = "এই ফোন নম্বর দিয়ে ইতিমধ্যে একটি অ্যাকাউন্ট আছে!";
                } else if (error.code === 'auth/weak-password') {
                    msg = "পাসওয়ার্ড খুব দুর্বল।";
                }
                alert(msg);
                btn.innerText = 'নিবন্ধন করুন';
                btn.disabled = false;
            }
        });
    </script>

</body>
</html>
